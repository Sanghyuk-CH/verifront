<!doctype html>
<!-- clean.css 를 그대로 적용한 화면. 런타임 검사 결과가 전부 ok 여야 한다. -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --color-primary: #3b82f6;
    --color-primary-hover: #2563eb;
    --color-surface: #ffffff;
    --color-text: #111827;
    --color-text-muted: #6b7280;
    --color-border: #e5e7eb;
    --color-danger: #ef4444;
  }
  /* 브라우저 기본 글자색(검정)은 토큰이 아니다. 정적 검사는 이 자리를 본 적이 없다. */
  body { color: var(--color-text); background-color: var(--color-surface); }
</style>
<link rel="stylesheet" href="clean.css">
</head>
<body>
  <p class="a">a</p>
  <p class="b">b</p>
  <p class="c">c</p>
  <p class="d">d</p>
  <p class="e">e</p>
  <p class="f">f</p>
  <p class="g">g</p>
  <p class="h">h</p>
  <p class="i">i</p>
  <p class="j">j</p>
</body>
</html>

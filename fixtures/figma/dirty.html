<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>design dirty</title>
    <!--
      fixtures/figma/card.json 과 어긋나게 심어둔 화면. 카드마다 반복되는 것은 세 번 잡힌다.
      묶음 프레임(Header, Body)에 해당하는 요소가 없다. 짝짓기가 풀어헤쳐야 한다.
        1. 카드 왼쪽 패딩 24px                         inset-left      wrong-token  ×3
        2. 배지가 일반 흐름의 inline-block 이고         배지↔제목, 카드 inset-top  unmeasurable ×6
           카드의 줄 높이가 64px 이라 줄 상자가 위아래로 여백을 보탠다
        3. 제목 아래 12px (시안 16px)                   gap-y           wrong-token  ×3
        4. .card p 가 .meta 의 margin-top 을 지운다      gap-y 0px       wrong-token  ×3
        5. 세 번째 카드에 구분선이 없다                 Divider         unmatched    ×1
           나머지 카드의 구분선은 border-top 이다. 이건 문제가 아니다. 짝짓기가 테두리를 선으로 받는다
        6. 버튼 사이 10px (시안 8px)                    gap-x           off-scale    ×2
        7. 주요 버튼 왼쪽 패딩 15px                     inset-left      near         ×3
        8. 주요 버튼 배경이 primary-hover               fill            wrong-token  ×3
        9. 제목 색 #1f2937                              text-color      violation    ×3
       10. 설명 색 #6b7281                              text-color      near         ×3
       11. 보조 버튼 테두리가 disabled 색               stroke          wrong-token  ×2
       12. 비활성 버튼을 opacity 로 흐리게              fill, text-color unmeasurable ×2
       13. 비활성 버튼에 테두리가 남아 1px 밀린다        inset ×4        near         ×4
       14. 두 번째 카드가 테두리 대신 그림자            stroke          missing      ×1
                                                        inset-right, inset-bottom  near ×2
       15. 완료 배지 배경이 같은 색의 반투명            fill            alpha-variant ×1
       16. 두 번째 카드의 버튼 순서가 반대다            gap-x           misplaced    ×1
    -->
    <style>
      body { margin: 0; padding: 40px; background: #f9fafb; font-family: system-ui, sans-serif; }
      .list { width: 560px; }
      .card { padding: 20px 20px 20px 24px; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px; line-height: 64px; }
      .card + .card { margin-top: 16px; }
      .card:nth-child(2) { border: 0; box-shadow: 0 1px 3px rgb(0 0 0 / 10%); }
      .badge { display: inline-block; margin-bottom: 8px; padding: 4px 8px; border-radius: 999px; font-size: 12px; line-height: 16px; font-weight: 600; }
      .badge-active { background: #3b82f6; color: #ffffff; }
      .badge-done { background: rgb(220 252 231 / 60%); color: #16a34a; }
      .badge-hold { background: #fef9c3; color: #ca8a04; }
      .title { margin: 0 0 12px; font-size: 16px; line-height: 24px; font-weight: 600; color: #1f2937; }
      .card p { margin: 0; }
      .desc { font-size: 14px; line-height: 20px; color: #6b7281; }
      .meta { margin-top: 4px; font-size: 13px; line-height: 20px; color: #6b7280; }
      .actions { display: flex; align-items: flex-start; gap: 10px; margin-top: 16px; padding-top: 16px; border-top: 1px solid #e5e7eb; }
      .card:nth-child(3) .actions { border-top: 0; padding-top: 17px; }
      .btn { font: inherit; font-size: 14px; line-height: 20px; font-weight: 500; padding: 8px 16px; border: 0; border-radius: 6px; }
      .btn-primary { background: #2563eb; color: #ffffff; padding-left: 15px; }
      .btn-secondary { background: #ffffff; color: #111827; border: 1px solid #d1d5db; }
      .btn-secondary:disabled { opacity: 0.5; }
    </style>
  </head>
  <body>
    <div class="list">
      <article class="card">
        <span class="badge badge-active">진행중</span>
        <h3 class="title">검색 필터 개선</h3>
        <p class="desc">검색 결과에 기간과 작성자 필터를 추가합니다. 필터 상태는 주소에 남깁니다.</p>
        <p class="meta">김하늘 · 9월 3일 수정</p>
        <div class="actions">
          <button type="button" class="btn btn-primary">열기</button>
          <button type="button" class="btn btn-secondary">보관</button>
        </div>
      </article>
      <article class="card">
        <span class="badge badge-done">완료</span>
        <h3 class="title">알림 설정 화면</h3>
        <p class="desc">알림 종류별로 켜고 끌 수 있게 했습니다. 기본값은 모두 켜짐입니다.</p>
        <p class="meta">박서준 · 8월 21일 수정</p>
        <div class="actions">
          <button type="button" class="btn btn-secondary">보관</button>
          <button type="button" class="btn btn-primary">열기</button>
        </div>
      </article>
      <article class="card">
        <span class="badge badge-hold">보류</span>
        <h3 class="title">빌드 캐시 정리</h3>
        <p class="desc">캐시 키 규칙이 정해지면 다시 시작합니다. 지금은 수동으로 비웁니다.</p>
        <p class="meta">이도윤 · 7월 30일 수정</p>
        <div class="actions">
          <button type="button" class="btn btn-primary">열기</button>
          <button type="button" class="btn btn-secondary" disabled>보관</button>
        </div>
      </article>
    </div>
  </body>
</html>

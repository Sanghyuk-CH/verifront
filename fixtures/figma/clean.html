<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>design clean</title>
    <!-- fixtures/figma/card.json 을 그대로 옮긴 화면. 판정이 전부 ok 여야 한다 -->
    <style>
      body { margin: 0; padding: 40px; background: #f9fafb; font-family: system-ui, sans-serif; }
      .list { width: 560px; display: flex; flex-direction: column; gap: 16px; }
      .card { display: flex; flex-direction: column; gap: 16px; padding: 20px; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px; }
      .header { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
      .badge { padding: 4px 8px; border-radius: 999px; font-size: 12px; line-height: 16px; font-weight: 600; }
      .badge-active { background: #3b82f6; color: #ffffff; }
      .badge-done { background: #dcfce7; color: #16a34a; }
      .badge-hold { background: #fef9c3; color: #ca8a04; }
      .title { margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; color: #111827; }
      .body { display: flex; flex-direction: column; gap: 4px; }
      .desc { margin: 0; font-size: 14px; line-height: 20px; color: #6b7280; }
      .meta { margin: 0; font-size: 13px; line-height: 20px; color: #6b7280; }
      .divider { height: 1px; background: #e5e7eb; }
      .actions { display: flex; align-items: flex-start; gap: 8px; }
      .btn { font: inherit; font-size: 14px; line-height: 20px; font-weight: 500; padding: 8px 16px; border: 0; border-radius: 6px; }
      .btn-primary { background: #3b82f6; color: #ffffff; }
      .btn-secondary { background: #ffffff; color: #111827; border: 1px solid #e5e7eb; }
      .btn-secondary:disabled { background: #d1d5db; color: #9ca3af; border: 0; }
    </style>
  </head>
  <body>
    <div class="list">
      <article class="card">
        <div class="header">
          <span class="badge badge-active">진행중</span>
          <h3 class="title">검색 필터 개선</h3>
        </div>
        <div class="body">
          <p class="desc">검색 결과에 기간과 작성자 필터를 추가합니다. 필터 상태는 주소에 남깁니다.</p>
          <p class="meta">김하늘 · 9월 3일 수정</p>
        </div>
        <div class="divider"></div>
        <div class="actions">
          <button type="button" class="btn btn-primary">열기</button>
          <button type="button" class="btn btn-secondary">보관</button>
        </div>
      </article>
      <article class="card">
        <div class="header">
          <span class="badge badge-done">완료</span>
          <h3 class="title">알림 설정 화면</h3>
        </div>
        <div class="body">
          <p class="desc">알림 종류별로 켜고 끌 수 있게 했습니다. 기본값은 모두 켜짐입니다.</p>
          <p class="meta">박서준 · 8월 21일 수정</p>
        </div>
        <div class="divider"></div>
        <div class="actions">
          <button type="button" class="btn btn-primary">열기</button>
          <button type="button" class="btn btn-secondary">보관</button>
        </div>
      </article>
      <article class="card">
        <div class="header">
          <span class="badge badge-hold">보류</span>
          <h3 class="title">빌드 캐시 정리</h3>
        </div>
        <div class="body">
          <p class="desc">캐시 키 규칙이 정해지면 다시 시작합니다. 지금은 수동으로 비웁니다.</p>
          <p class="meta">이도윤 · 7월 30일 수정</p>
        </div>
        <div class="divider"></div>
        <div class="actions">
          <button type="button" class="btn btn-primary">열기</button>
          <button type="button" class="btn btn-secondary" disabled>보관</button>
        </div>
      </article>
    </div>
  </body>
</html>

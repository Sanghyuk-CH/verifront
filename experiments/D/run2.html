<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>프로젝트</title>
    <style>
      :root {
        /* color tokens */
        --color-surface: #ffffff;
        --color-surface-raised: #f9fafb;
        --color-border: #e5e7eb;
        --color-text: #111827;
        --color-text-muted: #6b7280;
        --color-primary: #3b82f6;
        --color-primary-hover: #2563eb;
        --color-primary-fg: #ffffff;
        --color-success: #16a34a;
        --color-success-soft: #dcfce7;
        --color-warning: #ca8a04;
        --color-warning-soft: #fef9c3;
        --color-disabled: #d1d5db;
        --color-disabled-fg: #9ca3af;

        /* space tokens */
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
        --space-6: 24px;
        --space-8: 32px;
        --space-10: 40px;
        --space-12: 48px;
        --space-16: 64px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: var(--space-12);
        background-color: var(--color-surface-raised);
        color: var(--color-text);
        font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
        font-size: 15px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      .board {
        width: 520px;
        margin-left: auto;
        margin-right: auto;
        display: flex;
        flex-direction: column;
        gap: var(--space-4);
      }

      .card {
        background-color: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 10px;
        padding: var(--space-5);
        transition: border-color 120ms ease;
      }

      .card:hover {
        border-color: var(--color-primary);
      }

      .badge {
        display: inline-block;
        padding: var(--space-1) var(--space-2);
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.3;
      }

      .badge--active {
        background-color: var(--color-surface-raised);
        color: var(--color-primary);
        box-shadow: inset 0 0 0 1px var(--color-primary);
      }

      .badge--done {
        background-color: var(--color-success-soft);
        color: var(--color-success);
      }

      .badge--held {
        background-color: var(--color-warning-soft);
        color: var(--color-warning);
      }

      .card h3 {
        margin-top: var(--space-3);
        margin-bottom: var(--space-2);
        margin-left: 0;
        margin-right: 0;
        font-size: 17px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }

      .card p {
        margin: 0;
        color: var(--color-text-muted);
      }

      .meta {
        margin-top: var(--space-3);
        font-size: 13px;
        color: var(--color-text-muted);
      }

      .actions {
        display: flex;
        gap: var(--space-2);
        margin-top: var(--space-4);
        padding-top: var(--space-4);
        border-top: 1px solid var(--color-border);
      }

      .btn {
        padding: var(--space-2) var(--space-4);
        border-radius: 7px;
        border: 1px solid transparent;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.4;
        cursor: pointer;
        transition: background-color 120ms ease;
      }

      .btn:focus-visible {
        outline: 2px solid var(--color-primary);
        outline-offset: 2px;
      }

      .btn--primary {
        background-color: var(--color-primary);
        color: var(--color-primary-fg);
      }

      .btn--primary:hover {
        background-color: var(--color-primary-hover);
      }

      .btn--secondary {
        background-color: var(--color-surface);
        border-color: var(--color-border);
        color: var(--color-text);
      }

      .btn--secondary:hover {
        background-color: var(--color-surface-raised);
      }

      .btn--secondary:disabled {
        background-color: var(--color-surface-raised);
        border-color: var(--color-disabled);
        color: var(--color-disabled-fg);
        cursor: not-allowed;
      }

      @media (prefers-reduced-motion: reduce) {
        .card,
        .btn {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="board">
      <article class="card">
        <span class="badge badge--active">진행중</span>
        <h3>결제 모듈 리팩터링</h3>
        <p>결제 요청과 취소 로직을 하나의 서비스 계층으로 합칩니다. 카드사 연동 코드는 다음 단계에서 분리합니다.</p>
        <p class="meta">김서연 · 9월 10일 수정</p>
        <div class="actions">
          <button type="button" class="btn btn--primary">열기</button>
          <button type="button" class="btn btn--secondary">보관</button>
        </div>
      </article>

      <article class="card">
        <span class="badge badge--done">완료</span>
        <h3>온보딩 이메일 개편</h3>
        <p>가입 후 첫 주에 보내는 메일을 네 통에서 두 통으로 줄였습니다. 열람률은 기존 대비 12% 올랐습니다.</p>
        <p class="meta">박지훈 · 8월 28일 수정</p>
        <div class="actions">
          <button type="button" class="btn btn--primary">열기</button>
          <button type="button" class="btn btn--secondary">보관</button>
        </div>
      </article>

      <article class="card">
        <span class="badge badge--held">보류</span>
        <h3>재고 동기화 배치</h3>
        <p>물류 창고 API 교체 일정이 밀려 작업을 멈춘 상태입니다. 4분기 일정이 확정되면 다시 시작합니다.</p>
        <p class="meta">이하늘 · 7월 3일 수정</p>
        <div class="actions">
          <button type="button" class="btn btn--primary">열기</button>
          <button type="button" class="btn btn--secondary" disabled>보관</button>
        </div>
      </article>
    </main>
  </body>
</html>

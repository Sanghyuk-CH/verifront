<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>프로젝트 카드 리스트</title>
<style>
  :root {
    /* color tokens */
    --color-surface: #ffffff;
    --color-surface-raised: #f9fafb;
    --color-border: #e5e7eb;
    --color-text: #111827;
    --color-text-muted: #6b7280;
    --color-primary: #3b82f6;
    --color-primary-hover: #2563eb;
    --color-primary-fg: #ffffff;
    --color-success: #16a34a;
    --color-success-soft: #dcfce7;
    --color-warning: #ca8a04;
    --color-warning-soft: #fef9c3;
    --color-disabled: #d1d5db;
    --color-disabled-fg: #9ca3af;

    /* space tokens */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-8: 32px;
    --space-10: 40px;
    --space-12: 48px;
    --space-16: 64px;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: var(--space-8);
    background: var(--color-surface-raised);
    color: var(--color-text);
    font-family: Inter, "Helvetica Neue", Arial, sans-serif;
  }

  .card-list {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--space-4);
    width: 560px;
  }

  .card {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--space-4);
    width: 100%;
    padding: var(--space-5);
    border: 1px solid var(--color-border);
    border-radius: 12px;
    background: var(--color-surface);
  }

  .card:hover {
    border-color: var(--color-primary);
  }

  .card__header {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--space-2);
    width: 100%;
  }

  .badge {
    display: flex;
    padding: var(--space-1) var(--space-2);
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    line-height: 16px;
  }

  .badge--progress {
    background: var(--color-primary);
    color: var(--color-primary-fg);
  }

  .badge--done {
    background: var(--color-success-soft);
    color: var(--color-success);
  }

  .badge--hold {
    background: var(--color-warning-soft);
    color: var(--color-warning);
  }

  .card__title {
    margin: 0;
    width: 100%;
    font-size: 16px;
    font-weight: 600;
    line-height: 24px;
    color: var(--color-text);
  }

  .card__body {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--space-1);
    width: 100%;
  }

  .card__description {
    margin: 0;
    width: 100%;
    font-size: 14px;
    font-weight: 400;
    line-height: 20px;
    color: var(--color-text-muted);
  }

  .card__meta {
    width: 100%;
    font-size: 13px;
    font-weight: 400;
    line-height: 20px;
    color: var(--color-text-muted);
  }

  .card__divider {
    width: 100%;
    height: 1px;
    background: var(--color-border);
  }

  .card__actions {
    display: flex;
    gap: var(--space-2);
  }

  .button {
    padding: var(--space-2) var(--space-4);
    border: 0;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    line-height: 20px;
    text-align: left;
  }

  .button--primary {
    background: var(--color-primary);
    color: var(--color-primary-fg);
  }

  .button--primary:hover {
    background: var(--color-primary-hover);
  }

  .button--secondary {
    border: 1px solid var(--color-border);
    background: var(--color-surface);
    color: var(--color-text);
  }

  .button--secondary:disabled {
    border: 0;
    background: var(--color-disabled);
    color: var(--color-disabled-fg);
  }
</style>
</head>
<body>
  <main class="card-list">
    <article class="card">
      <div class="card__header">
        <span class="badge badge--progress">진행중</span>
        <h3 class="card__title">검색 필터 개선</h3>
      </div>
      <div class="card__body">
        <p class="card__description">검색 결과에 기간과 작성자 필터를 추가합니다. 필터 상태는 주소에 남깁니다.</p>
        <div class="card__meta">김하늘 · 9월 3일 수정</div>
      </div>
      <div class="card__divider"></div>
      <div class="card__actions">
        <button type="button" class="button button--primary">열기</button>
        <button type="button" class="button button--secondary">보관</button>
      </div>
    </article>

    <article class="card">
      <div class="card__header">
        <span class="badge badge--done">완료</span>
        <h3 class="card__title">알림 설정 화면</h3>
      </div>
      <div class="card__body">
        <p class="card__description">알림 종류별로 켜고 끌 수 있게 했습니다. 기본값은 모두 켜짐입니다.</p>
        <div class="card__meta">박서준 · 8월 21일 수정</div>
      </div>
      <div class="card__divider"></div>
      <div class="card__actions">
        <button type="button" class="button button--primary">열기</button>
        <button type="button" class="button button--secondary">보관</button>
      </div>
    </article>

    <article class="card">
      <div class="card__header">
        <span class="badge badge--hold">보류</span>
        <h3 class="card__title">빌드 캐시 정리</h3>
      </div>
      <div class="card__body">
        <p class="card__description">캐시 키 규칙이 정해지면 다시 시작합니다. 지금은 수동으로 비웁니다.</p>
        <div class="card__meta">이도윤 · 7월 30일 수정</div>
      </div>
      <div class="card__divider"></div>
      <div class="card__actions">
        <button type="button" class="button button--primary">열기</button>
        <button type="button" class="button button--secondary" disabled>보관</button>
      </div>
    </article>
  </main>
</body>
</html>
